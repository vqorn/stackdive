[package]
name = "stackdive"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A tiny roguelike for your terminal. Dive down the stack and squash the bugs."
license = "MIT"
readme = "README.md"
repository = "https://github.com/vqorn/stackdive"
keywords = ["roguelike", "game", "terminal", "tui", "cli"]
categories = ["games", "command-line-utilities"]

[dependencies]
crossterm = "0.29"

[profile.release]
lto = true
codegen-units = 1
strip = true
